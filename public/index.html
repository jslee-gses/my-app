<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8 allows the page to display text consistently across browsers. -->
    <meta charset="UTF-8" />

    <!-- This makes the layout responsive on phones as well as desktop screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The browser tab title. Change this independently from the on-page heading. -->
    <title>Hello World!</title>

    <!-- Keeping styles in a separate file makes future design changes simple. -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      main identifies this page's primary content for assistive technologies.
      The class names describe their roles so the design remains easy to extend.
    -->
    <main class="welcome-card">
      <!-- The required application title. -->
      <h1>Hello World!</h1>

      <!-- The required introduction text. -->
      <p>I'm Jae Seung Lee</p>
    </main>
  </body>
</html>
